services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3001"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
